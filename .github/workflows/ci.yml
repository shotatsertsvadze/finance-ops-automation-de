name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite is mostly integration tests against a real database: the
    # transition table, the commitment ledger and the partial unique indexes
    # are Postgres behaviour, and mocking them would test the mock.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A known high or critical vulnerability in any dependency fails the build.
      - run: npm audit --audit-level=high

      # Two databases, not one. `testDeps()` drops and rebuilds the schema, and
      # refuses to do so if TEST_DATABASE_URL and DATABASE_URL reach the same
      # database - so running with both set exercises that guard rather than
      # skipping it.
      - name: Create the databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database finops'
          psql -h localhost -U postgres -c 'create database finops_test'

      # `npm test` passes --env-file, so the file has to exist. This is the
      # `cp .env.example .env` step from the README, with CI's own values.
      - name: Write .env
        run: |
          cat > .env <<'ENV'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/finops
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/finops_test
          STORAGE_DIR=./storage
          ENV

      # Without it the six browser tests skip, and the two things only a
      # browser can answer - that a stored document does not execute, and that
      # the accessibility rules take effect - would go unchecked here.
      - run: npx playwright install --with-deps chromium

      # The real, pinned KoSIT validator (ADR-078). The artifacts are cached by
      # the pins file and checked against its SHA-256 on every run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: vendor/kosit
          key: kosit-${{ hashFiles('server/integrations/kosit-pins.js') }}

      - run: npm run kosit:fetch

      - name: Start the validator and wait until it answers
        run: |
          nohup npm run kosit > kosit.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:8081/server/health > /dev/null && exit 0
            sleep 1
          done
          cat kosit.log
          exit 1

      # KOSIT_TEST_REQUIRED: the real-validator tests fail rather than skip,
      # so this job cannot pass without having exercised the validator.
      - run: npm test
        env:
          KOSIT_TEST_URL: http://127.0.0.1:8081
          KOSIT_TEST_REQUIRED: "true"

      - if: failure()
        run: cat kosit.log || true

      # The suite never imports the client's entry point, so a broken build
      # would ship with this badge still green.
      - run: npm run build

  # The showcase path: `docker compose up` must give a working demo on a
  # machine with nothing but Docker (ADR-076).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose up -d --build

      - name: Wait until the demo is ready
        run: |
          for i in $(seq 1 90); do
            curl -fs localhost:4400/api/health/ready && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: The page is served and a demo account sees the demo month
        run: |
          curl -fs localhost:4400/ | grep -q '<div id="root">'
          jar=$(mktemp)
          curl -fs -c "$jar" -H 'Content-Type: application/json' \
            -d '{"email":"jonas.weber@nordwerk.example","password":"nordwerk-demo"}' \
            localhost:4400/api/auth/login > /dev/null
          curl -fs -b "$jar" localhost:4400/api/invoices/counts | tee /dev/stderr | grep -q '"total":70'

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down -v
